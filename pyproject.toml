[project]
name = "omega-simulator"
version = "0.1.0"
description = "eScript interpreter and combat simulator for the Zuluhotel Omega UO shard"
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["jupyterlab", "matplotlib", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
